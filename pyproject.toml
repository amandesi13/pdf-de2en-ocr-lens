[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf-de2en-ocr-lens"
version = "0.1.0"
description = "German-to-English PDF converter with OCR support for diagrams and graphics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Amandeep Singh" }
]
keywords = ["pdf", "ocr", "translation", "german", "english", "tesseract", "deepl"]
dependencies = [
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "requests>=2.31"
]

[project.optional-dependencies]
argos = ["argostranslate>=1.9"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
pdf-de2en = "pdf_de2en_ocr_lens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_de2en_ocr_lens"]
